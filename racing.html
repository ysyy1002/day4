<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: 'Jua', 'Malgun Gothic', system-ui, sans-serif; user-select: none; color: #fff; }
  canvas#gl { position: fixed; inset: 0; display: block; }
  .hud { position: fixed; top: 0; bottom: 0; pointer-events: none; display: none; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .hud .pos { position: absolute; left: 20px; top: 14px; font-size: 64px; line-height: 1; color: #ffe14a; }
  .hud .pos small { font-size: 24px; color: #fff; }
  .hud .lap { position: absolute; left: 22px; top: 86px; font-size: 22px; }
  .hud .time { position: absolute; left: 22px; top: 116px; font-size: 18px; opacity: .85; }
  .hud .who { position: absolute; right: 20px; top: 16px; padding: 4px 14px; border-radius: 999px; font-size: 20px; background: var(--c); color: #fff; text-shadow: none; }
  .hud .spd { position: absolute; right: 24px; bottom: 54px; text-align: right; font-size: 74px; line-height: 1; font-variant-numeric: tabular-nums; }
  .hud .spd small { font-size: 20px; margin-left: 6px; opacity: .9; }
  .hud .nit { position: absolute; right: 24px; bottom: 26px; width: 240px; height: 16px; border-radius: 9px; background: rgba(0,0,0,.45); overflow: hidden; border: 2px solid rgba(255,255,255,.7); }
  .hud .nit i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #29d3ff, #8a5cff, #ff5fa2); }
  .hud .nit.on i { filter: brightness(1.6) saturate(1.4); }
  .hud .nl { position: absolute; right: 270px; bottom: 24px; font-size: 16px; }
  .hud .msg { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 56px; color: #ffe14a; opacity: 0; }
  .hud .msg.show { animation: msg 1.8s ease-out; }
  @keyframes msg { 0% { opacity: 0; transform: scale(.5); } 15% { opacity: 1; transform: scale(1.15); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
  #divider { position: fixed; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 12px rgba(0,0,0,.7); display: none; z-index: 2; }
  #mini { position: fixed; width: 170px; height: 170px; pointer-events: none; display: none; z-index: 3; background: rgba(0,0,0,.35); border-radius: 16px; border: 2px solid rgba(255,255,255,.6); }
  #cd { position: fixed; left: 0; right: 0; top: 24%; text-align: center; font-size: 150px; color: #fff; pointer-events: none; z-index: 4; text-shadow: 0 6px 0 rgba(150,40,0,.7), 0 0 40px rgba(255,170,40,.9); opacity: 0; }
  #cd.show { animation: cd 1s ease-out; }
  @keyframes cd { 0% { opacity: 0; transform: scale(2); } 25% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(.8); } }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; z-index: 5; background: radial-gradient(ellipse at center, rgba(255,140,30,.15), rgba(10,20,40,.7)); }
  .overlay h1 { margin: 0 0 6px; font-size: clamp(40px, 8vw, 88px); line-height: 1.05; background: linear-gradient(180deg, #fff6c4, #ffb02e 55%, #ff6a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 rgba(110,40,0,.7)) drop-shadow(0 0 24px rgba(255,170,40,.7)); }
  .overlay p { margin: 8px 0; font-size: clamp(14px, 2.2vw, 19px); text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .modes { display: flex; gap: 20px; justify-content: center; margin: 22px 0; flex-wrap: wrap; }
  button.big { font: inherit; font-size: 26px; padding: 14px 40px; border: 0; border-radius: 999px; cursor: pointer; color: #fff; background: linear-gradient(180deg, #ffbf3a, #ff7a00); box-shadow: 0 6px 0 #b24a00, 0 0 26px rgba(255,150,30,.7); transition: transform .1s; }
  button.big.alt { background: linear-gradient(180deg, #5cc8ff, #1f6bff); box-shadow: 0 6px 0 #0f3fa0, 0 0 26px rgba(60,140,255,.7); }
  button.big:hover { transform: translateY(-3px); } button.big:active { transform: translateY(4px); box-shadow: 0 2px 0 #b24a00; }
  .keys { display: inline-grid; grid-template-columns: auto auto auto; gap: 6px 22px; text-align: left; padding: 14px 22px; background: rgba(0,0,0,.42); border-radius: 18px; font-size: clamp(13px, 1.9vw, 16px); }
  .keys b { color: #ffd23f; } .keys .h { color: #9ad; }
  #result { display: none; }
  #result table { margin: 14px auto 22px; border-collapse: collapse; font-size: 22px; min-width: 360px; background: rgba(0,0,0,.4); border-radius: 14px; overflow: hidden; }
  #result td, #result th { padding: 8px 18px; } #result tr:nth-child(even) { background: rgba(255,255,255,.06); }
  #result tr.me td { color: #ffe14a; }
  #back { position: fixed; left: 14px; bottom: 10px; color: #fff; font-size: 14px; text-decoration: none; text-shadow: 0 1px 4px rgba(0,0,0,.8); z-index: 6; }
  #tip { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 12px; opacity: .75; z-index: 3; text-shadow: 0 1px 4px #000; pointer-events: none; }
</style>

      <span></span><span><b style="color:#ff7a6a">P1</b></span><span><b style="color:#7aaaff">P2</b></span>

  </div>
</div>
<div id="result" class="overlay">
  <div>
    <h1>레이스 종료!</h1>
    <table id="rtable"></table>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const clamp = THREE.MathUtils.clamp, rand = (a, b) => a + Math.random() * (b - a);
const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const LAPS = 3, TW = 16, N = 700, MAXV = 62, ACC = 38;

// =====================================================================
//  렌더러 / 씬 / 조명 / 하늘
// =====================================================================
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd1eeff, 140, 760);
scene.add(new THREE.HemisphereLight(0xdff3ff, 0x6a9a50, 1.5));
const sunL = new THREE.DirectionalLight(0xfff2d0, 2.4); sunL.position.set(-50, 45, 70); scene.add(sunL);
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `varying vec3 vP; void main(){ float h = clamp(vP.y, 0., 1.); vec3 c = mix(vec3(.82,.93,1.), vec3(.2,.52,.92), pow(h, .55));
    float s = max(0., dot(normalize(vP), normalize(vec3(-.5,.45,.7)))); c += vec3(1.,.9,.6) * pow(s, 220.) * 1.6 + vec3(1.,.85,.5) * pow(s, 8.) * .22; gl_FragColor = vec4(c, 1.); }`
}));
sky.renderOrder = -1; scene.add(sky);

function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); } return t;
}

// =====================================================================
//  트랙: 폐곡선 스플라인 → 리본 메시
// =====================================================================
const ctrl = [[0, -100], [0, 0], [10, 80], [60, 140], [140, 160], [210, 120], [220, 50], [170, 0], [190, -70], [250, -120], [240, -190], [170, -230], [80, -220], [30, -170]];
const curve = new THREE.CatmullRomCurve3(ctrl.map(([x, z]) => new THREE.Vector3(x * 1.4, 0, z * 1.4)), true, 'centripetal');
const LEN = curve.getLength();
const SP = [], TG = [], RT = [], ANG = [];
for (let i = 0; i < N; i++) {
  const u = i / N, p = curve.getPointAt(u), t = curve.getTangentAt(u); t.y = 0; t.normalize();
  SP.push(p); TG.push(t); RT.push(new THREE.Vector3(-t.z, 0, t.x)); ANG.push(Math.atan2(t.x, t.z));
}
const center = SP.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / N);

function ribbon(a, b, y, material, uvLen) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const k = i % N, p = SP[k], r = RT[k], v = (i * LEN / N) / uvLen;
    pos.push(p.x + r.x * a, y, p.z + r.z * a, p.x + r.x * b, y, p.z + r.z * b); uv.push(0, v, 1, v);
    if (i < N) { const q = i * 2; idx.push(q, q + 2, q + 1, q + 1, q + 2, q + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, material);
}
const roadTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b3d44'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const v = 50 + Math.random() * 40; g.fillStyle = `rgb(${v},${v},${v + 4})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.fillStyle = '#f2f2f2'; g.fillRect(8, 0, 6, h); g.fillRect(w - 14, 0, 6, h);
  g.fillStyle = '#ffe14a'; g.fillRect(w / 2 - 3, 20, 6, 100);
});
const curbTex = canvasTex(64, 64, (g, w, h) => { g.fillStyle = '#e8402f'; g.fillRect(0, 0, w, h / 2); g.fillStyle = '#ffffff'; g.fillRect(0, h / 2, w, h / 2); });
const road = ribbon(-TW / 2, TW / 2, 0.05, new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.9, side: THREE.DoubleSide }), 16);
const curbMat = new THREE.MeshStandardMaterial({ map: curbTex, roughness: 0.8, side: THREE.DoubleSide });
scene.add(road, ribbon(TW / 2, TW / 2 + 1.3, 0.07, curbMat, 5), ribbon(-TW / 2 - 1.3, -TW / 2, 0.07, curbMat, 5));
const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#6fb04a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(60,130,40,.5)' : 'rgba(150,200,80,.4)'; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
}, [260, 260]);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2600, 2600), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

// 방호벽 (인스턴스)
{
  const BW = TW / 2 + 4.2, step = 3, cnt = Math.floor(LEN / step) * 2;
  const bar = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.9, step * 0.95), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }), cnt);
  const d = new THREE.Object3D(), c = new THREE.Color(); let n = 0;
  for (let s = 0; s < LEN; s += step) {
    const u = s / LEN, p = curve.getPointAt(u), t = curve.getTangentAt(u); t.y = 0; t.normalize();
    for (const side of [-1, 1]) {
      d.position.set(p.x - t.z * BW * side, 0.45, p.z + t.x * BW * side); d.rotation.set(0, Math.atan2(t.x, t.z), 0); d.updateMatrix();
      bar.setMatrixAt(n, d.matrix); bar.setColorAt(n, c.set(Math.floor(s / step) % 2 ? 0xe8402f : 0xffffff)); n++;
    }
  }
  bar.count = n; scene.add(bar);
}

// 출발선 + 게이트
{
  const chk = canvasTex(128, 32, (g, w, h) => { for (let x = 0; x < 16; x++) for (let y = 0; y < 4; y++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * 8, y * 8, 8, 8); } });
  const line = new THREE.Mesh(new THREE.PlaneGeometry(TW, 2.4), new THREE.MeshBasicMaterial({ map: chk })); line.rotation.x = -Math.PI / 2; line.rotation.z = Math.PI + ANG[0]; line.position.copy(SP[0]).setY(0.09);
  line.rotation.set(-Math.PI / 2, 0, 0); line.rotation.order = 'YXZ'; line.rotation.y = ANG[0]; scene.add(line);
  const g = new THREE.Group(); g.position.copy(SP[0]); g.rotation.y = ANG[0];
  const bm = new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.6 });
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), bm); p.position.set(s * (TW / 2 + 2), 5, 0); g.add(p); }
  const ban = canvasTex(512, 96, (c, w, h) => { c.fillStyle = '#ff8a00'; c.fillRect(0, 0, w, h); c.fillStyle = '#fff'; c.font = "700 56px 'Jua','Malgun Gothic',sans-serif"; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🍊 JEJU CIRCUIT 🍊', w / 2, h / 2 + 2); });
  const b = new THREE.Mesh(new THREE.BoxGeometry(TW + 5, 2.6, 0.8), [bm, bm, bm, bm, new THREE.MeshBasicMaterial({ map: ban }), new THREE.MeshBasicMaterial({ map: ban })]); b.position.y = 9.6; g.add(b);
  scene.add(g);
}

// 부스트 패드
const pads = [];
{
  const tex = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = 'rgba(0,0,0,0)'; g.clearRect(0, 0, w, h); g.strokeStyle = '#7dfcff'; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round';
    for (let k = 0; k < 2; k++) { g.beginPath(); g.moveTo(18, 16 + k * 52); g.lineTo(w / 2, 50 + k * 52); g.lineTo(w - 18, 16 + k * 52); g.stroke(); }
  });
  tex.wrapT = THREE.RepeatWrapping;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
  [[70, -3], [190, 3], [305, 0], [430, -3.5], [560, 3.5]].forEach(([i, off]) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(5, 9), mat.clone()); m.material.map = tex.clone(); m.material.map.needsUpdate = true; m.material.map.wrapT = THREE.RepeatWrapping;
    m.rotation.order = 'YXZ'; m.rotation.x = -Math.PI / 2; m.rotation.y = ANG[i];
    m.position.copy(SP[i]).addScaledVector(RT[i], off).setY(0.11); scene.add(m); pads.push({ m, i, p: m.position.clone(), t: TG[i], r: RT[i] });
  });
}

// 풍경: 감귤나무, 관중석, 한라산
{
  const trunkG = new THREE.CylinderGeometry(0.3, 0.45, 2.4, 6), crownG = new THREE.IcosahedronGeometry(2.4, 1), fruitG = new THREE.SphereGeometry(0.28, 8, 6);
  const M = 420, trunks = new THREE.InstancedMesh(trunkG, new THREE.MeshStandardMaterial({ color: 0x7a5230 }), M), crowns = new THREE.InstancedMesh(crownG, new THREE.MeshStandardMaterial({ color: 0x3f9a3a, flatShading: true }), M),
        fruits = new THREE.InstancedMesh(fruitG, new THREE.MeshStandardMaterial({ color: 0xff8c00, emissive: 0x552200 }), M * 3);
  const d = new THREE.Object3D(); let n = 0;
  for (let tries = 0; tries < 6000 && n < M; tries++) {
    const x = center.x + rand(-420, 420), z = center.z + rand(-420, 420); let ok = true;
    for (let i = 0; i < N; i += 2) { const dx = SP[i].x - x, dz = SP[i].z - z; if (dx * dx + dz * dz < 24 * 24) { ok = false; break; } }
    if (!ok) continue;
    const s = rand(0.8, 1.5); d.rotation.set(0, rand(0, 6), 0);
    d.position.set(x, 1.2 * s, z); d.scale.setScalar(s); d.updateMatrix(); trunks.setMatrixAt(n, d.matrix);
    d.position.set(x, 3.4 * s, z); d.updateMatrix(); crowns.setMatrixAt(n, d.matrix);
    for (let k = 0; k < 3; k++) { const a = rand(0, 6.28), p = rand(0.4, 1.3); d.position.set(x + Math.cos(a) * Math.sin(p) * 2.4 * s, 3.4 * s + Math.cos(p) * 2.4 * s, z + Math.sin(a) * Math.sin(p) * 2.4 * s); d.updateMatrix(); fruits.setMatrixAt(n * 3 + k, d.matrix); }
    n++;
  }
  trunks.count = crowns.count = n; fruits.count = n * 3; scene.add(trunks, crowns, fruits);

  // 한라산
  const mt = new THREE.Group(); mt.position.set(center.x - 520, 0, center.z + 80);
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x5f8f4a, roughness: 1, flatShading: true })); body.scale.set(420, 190, 300);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 10, 0, Math.PI * 2, 0, 0.55), new THREE.MeshStandardMaterial({ color: 0xf4f8ff, roughness: 0.9, flatShading: true })); cap.scale.set(425, 195, 305);
  mt.add(body, cap);
  for (let i = 0; i < 8; i++) { const o = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x74b24d, roughness: 1, flatShading: true })); const s = rand(30, 70); o.scale.set(s, s * 0.5, s); o.position.set(rand(-400, 400), 0, rand(-260, 260)); mt.add(o); }
  scene.add(mt);

  // 관중석
  const crowd = canvasTex(128, 32, (g, w, h) => { g.fillStyle = '#4a4f66'; g.fillRect(0, 0, w, h); for (let i = 0; i < 170; i++) { g.fillStyle = `hsl(${Math.random() * 360},80%,60%)`; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 2.4, 0, 7); g.fill(); } });
  const gs = new THREE.Group(); gs.position.copy(SP[8]).addScaledVector(RT[8], TW / 2 + 9); gs.rotation.y = ANG[8];
  for (let k = 0; k < 4; k++) { const t = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 46), new THREE.MeshStandardMaterial({ map: crowd, roughness: 1 })); t.position.set(-k * 3.2, 0.6 + k * 1.3, 0); gs.add(t); }
  const roof = new THREE.Mesh(new THREE.BoxGeometry(16, 0.5, 48), new THREE.MeshStandardMaterial({ color: 0xff8a00 })); roof.position.set(-5, 8.6, 0); gs.add(roof);
  for (const z of [-22, 22]) for (const x of [-1, -11]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.5, 8, 0.5), new THREE.MeshStandardMaterial({ color: 0x333 })); p.position.set(x, 4.2, z); gs.add(p); }
  scene.add(gs);
}

// =====================================================================
//  파티클 (연기 / 불꽃 / 스파크)
// =====================================================================
class Pool {
  constructor(n, blending) {
    this.n = n; this.pos = new Float32Array(n * 3); this.col = new Float32Array(n * 3); this.al = new Float32Array(n); this.sz = new Float32Array(n);

    }
  }
  carCollisions();
  for (const c of cars) {
    // 랩 처리
    const lapNow = clamp(Math.floor(c.total / N) + 1, 1, LAPS + 1);
    if (lapNow > c.lap && !c.finished) {
      const lt = raceT - c.lapStart; c.best = Math.min(c.best, lt); c.lapStart = raceT; c.lap = lapNow;
      if (lapNow <= LAPS) { if (c.human) { playSfx('lap'); msg(c, `LAP ${lapNow}`); } }
    }
    if (c.total >= N * LAPS && !c.finished) {
      c.finished = true; c.finishT = raceT; c.auto = true; if (c.human) { playSfx('fin'); const rk = ranking().indexOf(c) + 1; msg(c, `FINISH! ${ord(rk)}`); }
    }
  }
  if (humans.every(h => h.finished) && state === 'race') { state = 'finishing'; setTimeout(() => { if (state === 'finishing') showResult(); }, 2600); }
}
function updateVisuals(dt) {
  for (const c of cars) {
    const m = c.m, fx = Math.sin(c.h), fz = Math.cos(c.h);
    m.mesh.position.set(c.x, 0, c.z); m.mesh.rotation.y = c.h;
    m.tilt.rotation.z = clamp(-(c.vr || 0) * 0.012, -0.14, 0.14); m.tilt.rotation.x = clamp(-(c.thr || 0) * 0.015 * Math.min(1, Math.abs(c.speed) / 20), -0.04, 0.04);
    c.steerVis += ((c.steerIn || 0) * -0.45 - c.steerVis) * Math.min(1, dt * 12); m.fronts.forEach(f => f.rotation.y = c.steerVis);
    m.wheels.forEach(w => w.rotation.x += c.speed * dt / 0.46);
    m.flames.forEach(f => { f.visible = c.nitroOn; if (c.nitroOn) { f.scale.set(1, 1, 0.8 + Math.random() * 0.6); f.material.color.setHex(c.boostT > 0 ? 0xffa030 : 0x55ccff); } });
    if (c.nitroOn) for (const s of [-1, 1]) fire.emit(c.x - fx * 2.6 - fz * 0.5 * s, 0.6, c.z - fz * 2.6 + fx * 0.5 * s, -fx * 8 + rand(-1, 1), rand(0, 1.2), -fz * 8 + rand(-1, 1), rand(0.2, 0.4), c.boostT > 0 ? 0xff9a30 : 0x66d0ff, 1.1, 0.9, 0.8);
    if (c.drift || (c.thr < 0 && c.speed > 25)) for (const s of [-1, 1]) smoke.emit(c.x - fx * 1.5 + (-fz) * 1.05 * s, 0.3, c.z - fz * 1.5 + fx * 1.05 * s, rand(-0.6, 0.6), rand(0.4, 1.4), rand(-0.6, 0.6), rand(0.7, 1.2), 0xdddddd, 1.8, 0.55, 2.2);
  }
  smoke.update(dt); fire.update(dt);
  for (const p of pads) p.m.material.map.offset.y -= dt * 1.6;
}
function updateCameras(dt) {
  for (const c of humans) {
    const k = c.cam, r = clamp(Math.abs(c.speed) / MAXV, 0, 1.4);
    const slipYaw = c.h - clamp((c.vr || 0) * 0.02, -0.25, 0.25) * 0;   // 속도 방향 쪽으로 약간 끌려가는 느낌
    k.yaw += wrap(slipYaw - k.yaw) * Math.min(1, dt * 3.8);
    const dist = 9.5 + r * 2.2, h = 4.2 + r * 0.7;
    const tx = c.x - Math.sin(k.yaw) * dist, tz = c.z - Math.cos(k.yaw) * dist;
    k.cam.position.x += (tx - k.cam.position.x) * Math.min(1, dt * 12); k.cam.position.z += (tz - k.cam.position.z) * Math.min(1, dt * 12); k.cam.position.y += (h - k.cam.position.y) * Math.min(1, dt * 6);
    k.cam.lookAt(c.x + Math.sin(k.yaw) * 7, 1.6, c.z + Math.cos(k.yaw) * 7);
    const fov = 62 + r * 10 + (c.nitroOn ? 12 : 0); k.cam.fov += (fov - k.cam.fov) * Math.min(1, dt * 5);
  }
}
const miniBox = (() => { let a = 1e9, b = -1e9, c = 1e9, d = -1e9; for (const p of SP) { a = Math.min(a, p.x); b = Math.max(b, p.x); c = Math.min(c, p.z); d = Math.max(d, p.z); } return { x0: a, x1: b, z0: c, z1: d }; })();
function drawMini() {
  const cv = $('mini'), g = cv.getContext('2d'), W = cv.width, pad = 26, s = Math.min((W - pad * 2) / (miniBox.x1 - miniBox.x0), (W - pad * 2) / (miniBox.z1 - miniBox.z0));
  const ox = (W - (miniBox.x1 - miniBox.x0) * s) / 2, oz = (W - (miniBox.z1 - miniBox.z0) * s) / 2;
  const X = x => ox + (x - miniBox.x0) * s, Y = z => W - (oz + (z - miniBox.z0) * s);
  g.clearRect(0, 0, W, W); g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); SP.forEach((p, i) => i ? g.lineTo(X(p.x), Y(p.z)) : g.moveTo(X(p.x), Y(p.z))); g.closePath();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 12; g.stroke(); g.strokeStyle = '#444a58'; g.lineWidth = 8; g.stroke();
  g.fillStyle = '#fff'; g.fillRect(X(SP[0].x) - 7, Y(SP[0].z) - 2, 14, 4);
  for (const c of cars) { g.beginPath(); g.arc(X(c.x), Y(c.z), c.human ? 9 : 6, 0, 7); g.fillStyle = '#' + c.color.toString(16).padStart(6, '0'); g.fill(); if (c.human) { g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke(); } }
}
function updateHUD() {
  const rk = ranking();
  humans.forEach((c, i) => {
    const el = hudEls[i], pos = rk.indexOf(c) + 1;
    el.querySelector('.pos').innerHTML = `${pos}<small>/${cars.length}</small>`;
    el.querySelector('.lap').textContent = `LAP ${Math.min(c.lap, LAPS)} / ${LAPS}`;
    el.querySelector('.time').textContent = `${fmt(c.finished ? c.finishT : Math.max(0, raceT))}`;
    el.querySelector('.spd span').textContent = Math.round(Math.max(0, c.speed) * 3.2);
    el.querySelector('.nit i').style.width = c.nitro + '%'; el.querySelector('.nit').classList.toggle('on', c.nitroOn);
  });
}

window.__R = () => ({ cars, humans, state, raceT });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), W = innerWidth, H = innerHeight;
  if (state === 'countdown') {
    cdT -= dt; const n = Math.ceil(cdT);
    if (n !== lastCd && n >= 1) { lastCd = n; showCd(String(n)); playSfx('beep'); }
    if (cdT <= 0) { state = 'race'; raceT = 0; showCd('GO!'); playSfx('go'); }
    for (const c of cars) { c.speed = 0; c.thr = 0; c.steerIn = 0; }
    if (humans.length) humans.forEach(c => { const i = humanInput(c); c.thr = i.throttle; });
  } else if ((state === 'race' || state === 'finishing') && !paused) { updateRace(dt); }
  if (state !== 'title' && !paused) { updateVisuals(dt); updateCameras(dt); updateHUD(); drawMini(); if (ac) updateEngines(); }
  else if (state === 'title') { smoke.update(dt); fire.update(dt); }
  else if (ac) updateEngines();

  renderer.setClearColor(0xd1eeff);
  if (state === 'title') {
    const t = clock.elapsedTime * 0.12, cam = titleCam; cam.aspect = W / H; cam.position.set(center.x + Math.cos(t) * 460, 170, center.z + Math.sin(t) * 460); cam.lookAt(center.x, 0, center.z); cam.updateProjectionMatrix();
    renderer.setViewport(0, 0, W, H); renderer.setScissor(0, 0, W, H); smoke.mat.uniforms.uScale.value = fire.mat.uniforms.uScale.value = H * 0.6; sky.position.copy(cam.position); renderer.render(scene, cam);
  } else {
    const two = humans.length === 2, vw = two ? W / 2 : W;
    humans.forEach((c, i) => {
      const cam = c.cam.cam; cam.aspect = vw / H; cam.updateProjectionMatrix();
      renderer.setViewport(i * vw, 0, vw, H); renderer.setScissor(i * vw, 0, vw, H);
      smoke.mat.uniforms.uScale.value = fire.mat.uniforms.uScale.value = H * 0.6; sky.position.copy(cam.position); renderer.render(scene, cam);
    });
  }
});
const titleCam = new THREE.PerspectiveCamera(55, 1, 1, 3000);
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
resetRace(); cars.forEach(c => { c.m.mesh.visible = true; }); layoutHUD();
</script>
