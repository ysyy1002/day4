<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three.js Animation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; }
  canvas { display: block; }
  #go, #go2 { position: fixed; top: 20px; right: 20px; padding: 12px 22px; border: 1px solid #8866ff; border-radius: 999px;
        background: rgba(20, 16, 50, 0.7); color: #fff; font: 600 15px system-ui, sans-serif; text-decoration: none;
        backdrop-filter: blur(6px); transition: background .2s, transform .2s; }
  #go:hover { background: #8866ff; transform: scale(1.05); }
  #go2 { top: 74px; border-color: #2fb6c9; }
  #go2:hover { background: #2fb6c9; }
  #go3 { position: fixed; top: 128px; right: 20px; padding: 12px 22px; border: 1px solid #ff9a1f; border-radius: 999px;
         background: rgba(50, 25, 0, 0.7); color: #fff; font: 600 15px system-ui, sans-serif; text-decoration: none;
         backdrop-filter: blur(6px); transition: background .2s, transform .2s; }
  #go3:hover { background: #ff9a1f; transform: scale(1.05); }
  #hint { position: fixed; left: 16px; bottom: 12px; color: #8a90b0; font: 13px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<a id="go" href="space.html">🚀 우주 시뮬레이션 실행</a>
<a id="go2" class="go" href="jeju.html">🏝️ 제주도 보기</a>
<a id="go3" href="gamgyul.html">🍊 감귤 게임</a>
<div id="hint">마우스를 움직이면 카메라가 따라옵니다 · 클릭하면 색상이 바뀝니다</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060d, 0.035);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 조명
scene.add(new THREE.AmbientLight(0x404060, 1.2));
const key = new THREE.PointLight(0xff66cc, 120, 60);
key.position.set(8, 6, 8);
scene.add(key);
const fill = new THREE.PointLight(0x44aaff, 120, 60);
fill.position.set(-8, -5, 6);
scene.add(fill);

// 중앙 토러스 매듭
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(2.2, 0.65, 220, 32, 2, 3),
  new THREE.MeshStandardMaterial({ color: 0x8866ff, metalness: 0.7, roughness: 0.25 })
);
scene.add(knot);

// 와이어프레임 외곽 구
const shell = new THREE.Mesh(
  new THREE.IcosahedronGeometry(5, 2),
  new THREE.MeshBasicMaterial({ color: 0x3355ff, wireframe: true, transparent: true, opacity: 0.18 })
);
scene.add(shell);

// 궤도를 도는 구체들
const orbiters = [];
const palette = [0xff5c8a, 0x5cf0ff, 0xffd45c, 0x7dff5c, 0xc45cff];
for (let i = 0; i < 5; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 32, 32),
    new THREE.MeshStandardMaterial({ color: palette[i], emissive: palette[i], emissiveIntensity: 0.9 })
  );
  scene.add(m);
  orbiters.push({ mesh: m, radius: 4 + i * 0.7, speed: 0.4 + i * 0.12, tilt: i * 0.6, phase: i * 1.3 });
}

// 별 파티클
const N = 2500;
const pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 20 + Math.random() * 60;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
  pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
  pos[i * 3 + 2] = r * Math.cos(ph);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, sizeAttenuation: true }));
scene.add(stars);

// 입력
const mouse = { x: 0, y: 0 };
addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * 2 - 1;
});
let hue = 0.72;
addEventListener('click', () => {
  hue = Math.random();
  knot.material.color.setHSL(hue, 0.8, 0.6);
  shell.material.color.setHSL((hue + 0.1) % 1, 0.9, 0.55);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 루프
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();

  knot.rotation.x = t * 0.25;
  knot.rotation.y = t * 0.4;
  knot.scale.setScalar(1 + Math.sin(t * 1.5) * 0.05);

  shell.rotation.y = -t * 0.1;
  shell.rotation.x = t * 0.05;

  for (const o of orbiters) {
    const a = t * o.speed + o.phase;
    o.mesh.position.set(
      Math.cos(a) * o.radius,
      Math.sin(a) * o.radius * Math.sin(o.tilt),
      Math.sin(a) * o.radius * Math.cos(o.tilt)
    );
  }

  stars.rotation.y = t * 0.01;

  // 마우스 시차
  camera.position.x += (mouse.x * 4 - camera.position.x) * 0.05;
  camera.position.y += (-mouse.y * 3 - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
});
</script>
</body>
</html>
