<script type="module">

// 배경 방울

for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.15 + Math.random() * 0.4, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.8, 0.8), transparent: true, opacity: 0.35 }));

function canvasTexture(cv) { const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }

// ---- 1. 글자를 조각으로 자르기 ----
addScene({
  title: '글자를 레고 조각으로 자르기', icon: '✂️',

  build(g, T) {
    cam([0, 1.5, 13], [0, 0.3, 0]);

    const blocks = TOK.map(([t, c]) => { const b = makeBlock(t, c); b.userData.target = new THREE.Color(c); b.userData.body.material.color.copy(cream); b.userData.eyes.scale.setScalar(0.001); g.add(b); return b; });

// ---- 2. 의미 지도 ----
addScene({
  title: '뜻이 비슷하면 이웃사촌 (의미 지도)', icon: '🗺️',
  caps: ['번호표를 받은 단어들이 <strong>‘의미 지도’</strong>에 도착했어요. 처음엔 아무 데나 흩어져 있어요 🌫️',

  build(g, T) {

    const kl = makeLabel('🎛️ 손잡이(파라미터)', { h: 0.62, bg: '#fff', color: '#5a3a8a' }); kl.sprite.position.set(5.0, -1.4, 1); g.add(kl.sprite);

      robot.position.y = -0.9 + (mood === 'happy' ? Math.abs(Math.sin(time * 6)) * 0.5 : Math.sin(time * 2) * 0.05); head.rotation.z = mood === 'sad' ? Math.sin(time * 14) * 0.12 : Math.sin(time * 1.5) * 0.04; ant.material.emissiveIntensity = 0.5 + Math.sin(time * 6) * 0.3;

      const n = Math.floor(Math.pow(10, 9.3 * ease(ramp(t, 0, SCENES[5].D * 0.92)))); cnt.set('푼 문제 ' + (n > 99999999 ? Math.round(n / 1e8) / 10 + '억' : n.toLocaleString()) + '개');
      if (t >= ok && !cheered) { cheered = true; conf.burst(W(-1.4, 3, 1), 80); } conf.update(dt);

  }
});

// ---- 7. 정리 ----
addScene({
  title: '한눈에 정리!', icon: '🎉',
  caps: ['정리해 볼까요? <strong>①조각내고 ②번호 붙이고 ③의미 지도에 놓고 ④서로 쳐다보고 ⑤층층이 생각해서 ⑥다음 단어를 맞혀요!</strong>',
    '그리고 맞힌 단어를 붙여서 <strong>처음부터 다시</strong>! 이걸 반복하면 글이 한 줄, 두 줄 완성돼요 🔁',
    '이 구조의 이름이 바로 <strong>트랜스포머</strong>! 쳐다보기(어텐션)가 핵심이에요. ChatGPT, Gemini, Claude 같은 AI 친구들이 이 원리로 만들어졌어요 🤖 <em>(실제로는 훨씬 큰 숫자와 복잡한 계산이지만 아이디어는 똑같아요!)</em>'],
  build(g, T) {

    const steps = [['✂️', '조각내기', 0xffb347], ['🔢', '번호 붙이기', 0xff7fae], ['🗺️', '의미 지도', 0x59cf94], ['👀', '쳐다보기', 0x6aa9ff], ['🏢', '층층이 생각', 0xc08bff], ['🎯', '다음 단어', 0xff5a93]];
    const xs = steps.map((_, i) => -8.3 + i * 3.32), nodes = steps.map(([e, n, c], i) => { const grp = new THREE.Group(); grp.position.set(xs[i], 0.3, 0);
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.45, 32), new THREE.MeshStandardMaterial({ color: c, roughness: 0.35 })); disc.rotation.x = Math.PI / 2; grp.add(disc);
      const el = makeLabel(e, { h: 1.15 }); el.sprite.position.z = 0.5; grp.add(el.sprite); const nl = makeLabel(`${i + 1}. ${n}`, { h: 0.55, bg: '#fff', color: '#5a3a8a' }); nl.sprite.position.set(0, -1.75, 0.3); grp.add(nl.sprite); grp.scale.setScalar(0.001); g.add(grp); return grp; });
    const arrows = steps.slice(1).map((_, i) => { const m = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.55, 3), new THREE.MeshBasicMaterial({ color: 0x8d6bff })); m.rotation.z = -Math.PI / 2; m.position.set((xs[i] + xs[i + 1]) / 2, 0.3, 0); m.scale.setScalar(0.001); g.add(m); return m; });
    const loopPts = [W(xs[5], -2.4, 0), W(xs[5] - 1, -4.2, 0), W(0, -4.9, 0), W(xs[0] + 1, -4.2, 0), W(xs[0], -2.4, 0)], loopC = new THREE.CatmullRomCurve3(loopPts), loop = new THREE.Mesh(new THREE.TubeGeometry(loopC, 40, 0.09, 6), new THREE.MeshBasicMaterial({ color: 0xff6fa5 })); loop.visible = false; g.add(loop); const loopL = makeLabel('🔁 반복!', { h: 0.8, bg: '#ff6fa5', color: '#fff' }); loopL.sprite.position.set(0, -4.9, 0.5); loopL.sprite.visible = false; g.add(loopL.sprite);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe14a })); g.add(ball);
    const names = [['ChatGPT', 0x4fcf9a], ['Gemini', 0x6a8bff], ['Claude', 0xff9a6a]], fam = names.map(([n, c], i) => { const b = makeBlock(n, c, 0.75); b.position.set(-4.6 + i * 4.6, 3.9, 0); b.scale.setScalar(0.001); g.add(b); return b; });
    const tl = makeLabel('Transformer = 어텐션 + 층층이 생각', { h: 0.9, bg: '#6a4cff', color: '#fff' }); tl.sprite.position.set(0, 2.2, 1); tl.sprite.visible = false; g.add(tl.sprite); let cheered = false;
    return (t, dt, time) => {

      const bp = (time * 0.9) % 6, bi = Math.floor(bp), bf = bp - bi; ball.visible = t > T[0] + 3.5; if (bi < 5) { ball.position.set(lerp(xs[bi], xs[bi + 1], ease(bf)), 0.3 + Math.sin(bf * Math.PI) * 1.2, 0.8); } else { const c = loopC.getPoint(ease(bf)); ball.position.copy(c); }

      if (t > T[2] + 2.4 && !cheered) { cheered = true; conf.burst(W(-3, 3, 1), 70); conf.burst(W(3, 3, 1), 70); } conf.update(dt);

// =====================================================================
//  재생 컨트롤러
// =====================================================================
let cur = -1, stage = null, upd = null, t = 0, playing = false, auto = true, voiceOn = true, capIdx = -1, started = false;
const dots = $('dots'); SCENES.forEach((s, i) => { const d = document.createElement('i'); d.title = s.title; d.onclick = () => go(i); dots.appendChild(d); });
function speak(text) {
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const clean = text.replace(/<[^>]+>/g, '').replace(/[\p{Extended_Pictographic}️]/gu, '').replace(/ChatGPT/g, '챗지피티').replace(/Gemini/g, '제미나이').replace(/Claude/g, '클로드').replace(/Transformer/g, '트랜스포머').replace(/[“”‘’"']/g, '').replace(/[①②③④⑤⑥]/g, m => '일이삼사오육'['①②③④⑤⑥'.indexOf(m)] + '번 ');
    const u = new SpeechSynthesisUtterance(clean); u.lang = 'ko-KR'; u.rate = 1.0; u.pitch = 1.2; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ko')); if (v) u.voice = v; speechSynthesis.speak(u); } catch {}
}
function go(i, at = 0) {
  i = clamp(i, 0, SCENES.length - 1); if (stage) { scene.remove(stage); disposeGroup(stage); }
  cur = i; t = at; capIdx = -1; stage = new THREE.Group(); scene.add(stage); upd = SCENES[i].build(stage, SCENES[i].T);
  $('stepTitle').innerHTML = `<b>${i + 1}/${SCENES.length}</b>${SCENES[i].icon} ${SCENES[i].title}`;
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : k < i ? 'done' : ''; });
  $('end').style.display = 'none';
}
function setCaption(k) { const el = $('cap'); el.innerHTML = SCENES[cur].caps[k]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); speak(SCENES[cur].caps[k]); }
function setPlaying(p) { playing = p; $('bPlay').textContent = p ? '⏸' : '▶️'; if (!p) try { speechSynthesis.pause(); } catch {} else try { speechSynthesis.resume(); } catch {} }
const next = () => { if (cur < SCENES.length - 1) go(cur + 1); else { $('end').style.display = 'grid'; try { speechSynthesis.cancel(); } catch {} } };
$('startBtn').onclick = () => { $('intro').style.display = 'none'; started = true; go(0); setPlaying(true); };
$('bPlay').onclick = () => setPlaying(!playing); $('bNext').onclick = () => { go(cur + 1 > SCENES.length - 1 ? cur : cur + 1); setPlaying(true); }; $('bPrev').onclick = () => { go(cur - 1); setPlaying(true); };
$('bReplay').onclick = () => { go(cur); setPlaying(true); };
$('bVoice').onclick = () => { voiceOn = !voiceOn; $('bVoice').classList.toggle('off', !voiceOn); $('bVoice').textContent = voiceOn ? '🔊' : '🔇'; if (!voiceOn) try { speechSynthesis.cancel(); } catch {} else setCaption(Math.max(0, capIdx)); };
$('againBtn').onclick = () => { go(0); setPlaying(true); }; $('closeEnd').onclick = () => { $('end').style.display = 'none'; };
addEventListener('keydown', e => {
  if (!started) { if (e.code === 'Enter' || e.code === 'Space') $('startBtn').click(); return; }
  if (e.code === 'ArrowRight') $('bNext').click(); if (e.code === 'ArrowLeft') $('bPrev').click(); if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } if (e.code === 'KeyR') $('bReplay').click(); if (e.code === 'KeyV') $('bVoice').click();
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__T = { camera, get stage() { return stage; }, go, setT: v => { t = v; }, get t() { return t; }, pause: () => setPlaying(false), SCENES };

go(0); $('cap').innerHTML = '';
const clock = new THREE.Clock(), cd = { last: 0 };
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  if (started && playing) t += dt;
  const sc = SCENES[cur];
  if (started) {
    let k = 0; sc.T.forEach((s, i) => { if (t >= s) k = i; }); if (k !== capIdx) { capIdx = k; setCaption(k); }
    if (playing && t >= sc.D && auto) next();
    $('bar').style.width = ((cur + Math.min(1, t / sc.D)) / SCENES.length * 100) + '%';
  }
  upd(t, started && playing ? dt : dt * 0.0001, time);
  bub.children.forEach(b => { b.position.y += Math.sin(time * b.userData.s + b.userData.p) * 0.003; b.position.x += Math.cos(time * b.userData.s * 0.7 + b.userData.p) * 0.002; });
  const k = fitK(); const gp = goalLook.clone().add(goalPos.clone().sub(goalLook).multiplyScalar(k));
  camPos.lerp(gp, 1 - Math.exp(-dt * 3)); camLook.lerp(goalLook, 1 - Math.exp(-dt * 3)); camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera);
});
